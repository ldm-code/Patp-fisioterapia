<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/iconeFisio.svg" type="image/x-icon">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="/css/style.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
    <link href="https://googleapis.com" rel="stylesheet">

    <title>Login</title>
</head>

<body class="bg-light">

    <main class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card shadow p-4" style="width: 100%; max-width: 420px;">

            <div class="card-body">

                <h1 class="text-center mb-4">
                    Login
                </h1>

                <form action="/login" method="POST">

                    <div class="mb-3">

                        <label for="email" class="form-label">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Digite seu e-mail"
                            required
                        >

                    </div>

                    <div class="mb-4">

                        <label for="senha" class="form-label">
                            Senha
                        </label>

                        <div class="input-group">

                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                class="form-control"
                                placeholder="Digite sua senha"
                                required
                            >

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                id="btnSenha"
                            >
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                        id="enviar"
                    >
                        Entrar
                    </button>

                </form>
               <p class="text-center mt-3 mb-0">
                    Ainda não tem um cadastro?
                         <a th:href="@{/index}"
                         
                         id="link"
                         >Cadastrar-se</a>
               </p> 

            </div>

        </div>

    </main>

   <div id="mensagemErro" th:if="${erro}" th:text="${erro}"></div>


    <script src="/js/olhoSenha.js"></script>
    <script src="/js/login.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYJwRwcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>

</body>

</html>
