<!DOCTYPE html>

<html lang="pt-BR">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/assets/iconeFisio.svg" type="image/x-icon">
<title>Cadastro de Pacientes</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
   
>

<!-- Bootstrap Icons -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
>

<!-- Seu CSS -->
<link rel="stylesheet" href="/css/style.css">


</head>

<body>


<main class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow p-4" style="width: 100%; max-width: 420px;">

        <div class="card-body">

            <h1 class="text-center mb-4">
                Cadastro de Pacientes
            </h1>

            <form id="formCadastro">

                <!-- Nome -->
                <div class="mb-3">

                    <label for="nome" class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        class="form-control"
                        placeholder="Digite o nome"
                        required
                    >

                </div>


                <!-- Telefone -->
                <div class="mb-3">

                    <label for="telefone" class="form-label">
                        Telefone para Contato:
                    </label>

                    <input
                        type="text"
                        id="telefone"
                        name="telefone"
                        class="form-control"
                        placeholder="Digite o telefone ou WhatsApp"
                        maxlength="15"
                        required
                    >

                </div>


                <!-- CPF -->
                <div class="mb-4">

                    <label for="cpf" class="form-label">
                        CPF:
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        class="form-control"
                        placeholder="Digite o CPF"
                        maxlength="14"
                        required
                    >

                </div>


                <!-- Botão -->
                <button
                    type="submit"
                    class="btn btn-primary w-100"
                    id="enviar"
                >
                    Cadastrar
                </button>

            </form>


            <p class="text-center mt-3 mb-0">

                <a
                    href="/pagina/pacientes"
                    id="link"
                >
                    Voltar
                </a>

            </p>

        </div>

    </div>

</main>


<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForGLVvwx9Hj09JcYn3nv7wiPVlz7YYJwRwcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
></script>


<!-- JavaScript do cadastro -->
<script
    type="module"
    src="/js/pacientesCadastro.js"
></script>


</body>

</html>
