
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/iconeFisio.svg" type="image/x-icon">
    <title>Alunos - Professor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="/css/alunos.css">
</head>

<body th:data-id-professor="${session.idProfessor}">

    <div class="layout">

        <div id="sidebar-container"></div>

        <main class="conteudo-alunos py-5">

            <div class="cabecalho">
                <div>
                    <h1>Alunos</h1>
                    <p>Consulta de alunos e gerenciamento de turnos</p>
                </div>
            </div>

            <div class="filtros-alunos">

                <div class="campo-filtro">
                    <label for="filtroEmail">
                        <i class="bi bi-envelope"></i>
                        E-mail
                    </label>

                    <div class="input-filtro">
                        <i class="bi bi-search"></i>

                        <input
                            type="text"
                            id="filtroEmail"
                            placeholder="Buscar por e-mail..."
                        >
                    </div>
                </div>

                <button class="btn-filtrar" id="btnFiltrar">
                    <i class="bi bi-funnel"></i>
                    Filtrar
                </button>

            </div>

            <section class="lista-alunos" id="listaAlunos">
                <!-- Cards carregados pela API -->
            </section>

        </main>
    </div>

    <script src="/js/alunosComum.js"></script>

</body>
</html>
