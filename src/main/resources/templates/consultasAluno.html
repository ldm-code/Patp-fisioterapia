<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <link
        rel="icon"
        href="/assets/iconeFisio.svg"
        type="image/x-icon">

    <title>Minhas consultas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">



    <link
        rel="stylesheet"
        th:href="@{/css/sidebar.css}">

    <link
        rel="stylesheet"
        href="/css/consultasAluno.css">

</head>

<body>

<div class="layout">

    <div
        th:replace="~{fragments/sidebar :: sidebarAluno}">
    </div>

    <main class="conteudo-consultas-aluno">

        <div class="cabecalho-consultas-aluno">

            <div>

                <h1>Minhas consultas</h1>

                <p>
                    Consulte suas consultas agendadas
                </p>

            </div>

        </div>


        <section class="card-consultas-aluno">

            <div class="cabecalho-card">

                <div>

                    <h2>
                        <i class="bi bi-calendar2-week"></i>
                        Consultas agendadas
                    </h2>

                    <span id="contadorConsultas">
                        0 consultas
                    </span>

                </div>

            </div>


            <div
                id="listaConsultas"
                class="lista-consultas-aluno">

            </div>


            <div
                id="mensagemVazia"
                class="mensagem-vazia-aluno"
                style="display: none;">

                <i class="bi bi-calendar-x"></i>

                <h5>
                    Nenhuma consulta agendada
                </h5>

                <p>
                    Você não possui consultas agendadas no momento.
                </p>

            </div>


            <div
                id="mensagemErro"
                class="mensagem-erro-aluno"
                style="display: none;">

                Não foi possível carregar suas consultas.

            </div>

        </section>

    </main>

</div>


<script src="/js/consultasAluno.js"></script>

<script
    th:src="@{/js/sidebar.js}"
    defer>
</script>

</body>

</html>
