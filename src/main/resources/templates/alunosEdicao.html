<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="icon"
        href="/assets/iconeFisio.svg"
        type="image/x-icon"
    >

    <title>Editar Aluno</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- CSS existente -->

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<main class="container d-flex justify-content-center align-items-center min-vh-100">

    <div
        class="card shadow p-4"
        style="width: 100%; max-width: 500px;"
    >

        <div class="card-body">


            <h1 class="text-center mb-4">

                Editar Aluno

            </h1>


            <form id="formEditarAluno">


                <!-- ID -->

                <input
                    type="hidden"
                    id="id"
                >


                <!-- Nome -->

                <div class="mb-3">

                    <label
                        for="nome"
                        class="form-label"
                    >

                        <i class="bi bi-person"></i>

                        Nome

                    </label>


                    <input
                        type="text"
                        id="nome"
                        class="form-control"
                        placeholder="Digite o nome completo"
                        required
                    >

                </div>


                <!-- CPF -->

                <div class="mb-3">

                    <label
                        for="cpf"
                        class="form-label"
                    >

                        <i class="bi bi-card-text"></i>

                        CPF

                    </label>


                    <input
                        type="text"
                        id="cpf"
                        class="form-control"
                        placeholder="Digite o CPF"
                        maxlength="14"
                        required
                    >

                </div>


                <!-- E-mail -->

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >

                        <i class="bi bi-envelope"></i>

                        E-mail

                    </label>


                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Digite o e-mail"
                        required
                    >

                </div>


                <!-- Tipo -->

                <div class="mb-3">

                    <label
                        for="tipo"
                        class="form-label"
                    >

                        <i class="bi bi-mortarboard"></i>

                        Tipo

                    </label>


                    <select
                        id="tipo"
                        class="form-control"
                        required
                    >

                        <option
                            value=""
                            disabled
                        >
                            Selecione o tipo
                        </option>

                        <option value="estagio">
                            Estágio
                        </option>

                        <option value="curso">
                            Cursando
                        </option>

                    </select>

                </div>


                <!-- ALTERAR SENHA -->

                <div class="mb-3">

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="alterarSenha"
                        >

                        <label
                            class="form-check-label"
                            for="alterarSenha"
                        >

                            Alterar senha

                        </label>

                    </div>

                </div>


                <!-- NOVA SENHA -->

                <div
                    class="mb-4"
                    id="campoSenha"
                    style="display: none;"
                >

                    <label
                        for="senha"
                        class="form-label"
                    >

                        <i class="bi bi-lock"></i>

                        Nova senha

                    </label>


                    <input
                        type="password"
                        id="senha"
                        class="form-control"
                        minlength="6"
                        placeholder="Digite a nova senha"
                    >


                    <div class="form-text">

                        A senha deve possuir pelo menos 6 caracteres.

                    </div>

                </div>


                <!-- SALVAR -->

                <button
                    type="submit"
                    class="btn w-100"
                    id="enviar"
                >

                    <i class="bi bi-check-lg"></i>

                    Salvar alterações

                </button>


            </form>


            <!-- VOLTAR -->

            <p class="text-center mt-3 mb-0">

                <a href="/pagina/alunos">

                    Voltar

                </a>

            </p>


        </div>

    </div>

</main>


<script
    type="module"
    src="/js/alunosEdicao.js"
></script>


</body>

</html>
