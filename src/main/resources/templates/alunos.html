<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alunos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="/css/alunos.css">

</head>

<body>

    <div class="layout">

        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- CONTEÚDO -->
        <main class="conteudo-alunos py-5">

            <!-- CABEÇALHO -->
            <div class="cabecalho">

                <div>

                    <h1>Alunos</h1>

                    <p>Gestão de cadastros de alunos</p>

                </div>

                <button class="btn-novo" id="btnNovoAluno">

                    <i class="bi bi-person-plus"></i>

                    Novo aluno

                </button>

            </div>


            <!-- FILTRO -->
            <div class="filtros-alunos">

                <div class="campo-filtro">

                    <label for="filtroEmail">

                        <i class="bi bi-envelope"></i>

                        E-mail

                    </label>

                    <div class="input-filtro">

                        <i class="bi bi-search"></i>

                        <input
                            type="text"
                            id="filtroEmail"
                            placeholder="Buscar por e-mail..."
                        >

                    </div>

                </div>

                <button class="btn-filtrar" id="btnFiltrar">

                    <i class="bi bi-funnel"></i>

                    Filtrar

                </button>

            </div>


            <!-- LISTA DE ALUNOS -->
            <section class="lista-alunos" id="listaAlunos">

                <!--
                    Os alunos serão inseridos aqui
                    pelo alunos.js através da API REST.
                -->

            </section>

        </main>

    </div>


    <script type="module" src="/js/alunos.js"></script>

</body>

</html>
